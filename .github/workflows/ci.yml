name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Use repository npm version
        run: npm install --global npm@11.12.1

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: AI evaluations
        run: npm run test:ai

      - name: Secret scan
        run: npm run security:secrets

      - name: Dependency audit
        run: npm run security:dependencies

      - name: Build
        run: npm run build

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Use repository npm version
        run: npm install --global npm@11.12.1

      - name: Install dependencies
        run: npm ci

      - name: Start local Supabase and apply migrations
        env:
          SUPABASE_TELEMETRY_DISABLED: "true"
        run: npm run db:start:ci

      - name: Reset and seed database
        env:
          SUPABASE_TELEMETRY_DISABLED: "true"
        run: npm run db:reset

      - name: Lint database
        env:
          SUPABASE_TELEMETRY_DISABLED: "true"
        run: npm run db:lint

      - name: Test schema and RLS
        env:
          SUPABASE_TELEMETRY_DISABLED: "true"
        run: npm run db:test

      - name: Install Chromium for browser acceptance
        run: npx playwright install --with-deps chromium

      - name: Browser accessibility and mobile smoke tests
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_ACJWlzQHlZjBrEguHvfOxg_3BJgxAaH
          PUBLIC_RATE_LIMIT_SECRET: ci-browser-only-rate-limit-secret-32-bytes
        run: npm run test:e2e

      - name: Verify generated database types
        env:
          SUPABASE_TELEMETRY_DISABLED: "true"
        run: |
          npm run db:types
          git diff --exit-code -- lib/supabase/database.types.ts

      - name: Stop local Supabase
        if: always()
        env:
          SUPABASE_TELEMETRY_DISABLED: "true"
        run: npm run db:stop
